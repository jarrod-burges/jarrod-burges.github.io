<header>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Jarrod M. Burges",
  "url": "https://jarrodburges",
  "description": "A researcher profile for the geologist Jarrod M. Burges.",
}
</script>
  <div>
    <a class="site-title" href="{{ site.url }}">{{ site.title }}</a>
    <small>
      {% if site.tagshort %}
      {{ site.tagshort }}
      {% else %}
      {{ site.taglong }}
      {% endif %}
    </small>
  </div>
  <a id="theme-toggle" class="toggle-icon" onclick="modeSwitcher()"></a>
</header>
