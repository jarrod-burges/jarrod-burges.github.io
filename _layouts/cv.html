---
layout: default
title: "Curriculum Vitae"
---

<!-- make sure this is in your default <head> -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* allow container to shrink below 816px */
  .full-width-breakout {
    max-width: 816px;      /* fixed max for A4-like width */
    width: 100%;           /* fluid under that */
    margin: 0 auto;        /* center on larger screens */
    padding: 2rem 1rem;    /* slight side padding on mobile */
  }

  body {
    background-color: var(--oc-gray-9);
  }

  .full-width-breakout h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 1.5rem;
    color: white;
  }

  .download-btn {
    display: block;
    width: fit-content;
    margin: 0 auto 1.5rem;
    padding: 0.6rem 1.2rem;
    background-color: white;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }

  #pdf-viewer {
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    background-color: white;
  }

  #pdf-viewer canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 4px;
  }
</style>

<article>
  {% include header.html %}
  <main class="full-width-breakout">
    <h1>Curriculum Vitae</h1>
    <a class="download-btn" href="{{ "/burges_jarrod_cv.pdf" | relative_url }}" download>Download CV</a>
    <div id="pdf-viewer"></div>
  </main>
  {% include footer.html %}
</article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  const url = "{{ "/burges_jarrod_cv.pdf" | relative_url }}";
  const container = document.getElementById("pdf-viewer");

  pdfjsLib.getDocument(url).promise.then(async (pdf) => {
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const scale = 2; // render at 2x for sharpness on retina screens
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      container.appendChild(canvas);
    }
  });
</script>
