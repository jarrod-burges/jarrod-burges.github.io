---
layout: default
title: "Curriculum Vitae"
---

<!-- make sure this is in your default <head> -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* allow container to shrink below 816px */
  .full-width-breakout {
    max-width: 816px;      /* fixed max for A4-like width */
    width: 100%;           /* fluid under that */
    margin: 0 auto;        /* center on larger screens */
    padding: 2rem 1rem;    /* slight side padding on mobile */
  }

  body {
    background-color: var(--oc-gray-9);
  }

  .full-width-breakout h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 1.5rem;
    color: white;
  }

  .download-btn {
    display: block;
    width: fit-content;
    margin: 0 auto 1.5rem;
    padding: 0.6rem 1.2rem;
    background-color: white;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }

  #pdf-viewer {
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    background-color: white;
  }

  #pdf-viewer canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 4px;
  }

  .pdf-page {
    position: relative;
    margin-bottom: 4px;
  }

  .textLayer {
    position: absolute;
    top: 0;
    left: 0;
    overflow: hidden;
    line-height: 1;
  }

  .textLayer span {
    color: transparent;
    position: absolute;
    white-space: pre;
    cursor: text;
    transform-origin: 0% 0%;
  }

  .textLayer ::selection {
    background: rgba(0, 100, 255, 0.3);
  }
</style>

<article>
  {% include header.html %}
  <main class="full-width-breakout">
  <h1>Curriculum Vitae</h1>
  <a class="download-btn" href="{{ "/burges_jarrod_cv.pdf" | relative_url }}" download>Download CV</a>
  <div id="pdf-viewer"></div>
</main>
  {% include footer.html %}
</article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  const url = "{{ "/burges_jarrod_cv.pdf" | relative_url }}";
  const container = document.getElementById("pdf-viewer");

  pdfjsLib.getDocument(url).promise.then(async (pdf) => {
    const containerWidth = container.clientWidth || 800;
    const outputScale = window.devicePixelRatio || 1;

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const cssScale = containerWidth / page.getViewport({ scale: 1 }).width;
      const viewport = page.getViewport({ scale: cssScale });

      const pageDiv = document.createElement("div");
      pageDiv.className = "pdf-page";
      pageDiv.style.width = viewport.width + "px";
      pageDiv.style.height = viewport.height + "px";

      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";
      pageDiv.appendChild(canvas);

      const textLayerDiv = document.createElement("div");
      textLayerDiv.className = "textLayer";
      textLayerDiv.style.width = viewport.width + "px";
      textLayerDiv.style.height = viewport.height + "px";
      pageDiv.appendChild(textLayerDiv);

      container.appendChild(pageDiv);

      const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport, transform }).promise;

      const textContent = await page.getTextContent();
      await new pdfjsLib.TextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport,
      }).render();
    }
  });
</script>
